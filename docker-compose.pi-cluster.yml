version: "3.8"

services:
  # EQ12 Raspberry Pi Cluster Coordinator
  eq12-pi-coordinator:
    build:
      context: .
      dockerfile: Dockerfile.pi-coordinator
    container_name: eq12-pi-coordinator
    restart: unless-stopped
    ports:
      - "8880:8880" # Dashboard port
      - "8881:8881" # API port
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # For Docker API access
    networks:
      - eq12-cluster
      - eq12-network
    environment:
      - CLUSTER_CONFIG_PATH=/app/configs/raspberry_pi_cluster.json
      - LOG_LEVEL=INFO
      - DASHBOARD_PORT=8880
      - API_PORT=8881
      - CORAL_ENABLE=true
    depends_on:
      - redis
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pi-coordinator.rule=Host(`pi-coordinator.eq12.local`)"
      - "traefik.http.services.pi-coordinator.loadbalancer.server.port=8880"

  # Redis for task queuing and node coordination
  redis-cluster:
    image: redis:7-alpine
    container_name: eq12-redis-cluster
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-cluster-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - eq12-cluster

  # Node Health Monitor
  node-monitor:
    build:
      context: .
      dockerfile: Dockerfile.node-monitor
    container_name: eq12-node-monitor
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    networks:
      - eq12-cluster
    environment:
      - MONITOR_INTERVAL=30
      - ALERT_WEBHOOK_URL=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - redis-cluster

  # Task Scheduler for distributing EQ12 workloads
  task-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.task-scheduler
    container_name: eq12-task-scheduler
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - eq12-cluster
      - eq12-network
    environment:
      - REDIS_URL=redis://redis-cluster:6379
      - SCHEDULER_INTERVAL=10
      - CORAL_PRIORITY_BOOST=2
    depends_on:
      - redis-cluster
      - eq12-pi-coordinator

  # Coral TPU Model Server (runs on host with Coral connected)
  coral-model-server:
    build:
      context: .
      dockerfile: Dockerfile.coral-server
    container_name: eq12-coral-server
    restart: unless-stopped
    ports:
      - "8882:8882"
    volumes:
      - ./coral_models:/app/models
      - ./logs:/app/logs
      - /dev/bus/usb:/dev/bus/usb # USB device access
    networks:
      - eq12-cluster
    privileged: true # Required for USB access
    environment:
      - MODEL_SERVER_PORT=8882
      - CORAL_DEVICE_PATH=/dev/apex_0
      - MODEL_CACHE_SIZE=5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coral-server.rule=Host(`coral.eq12.local`)"
      - "traefik.http.services.coral-server.loadbalancer.server.port=8882"

  # SSH Tunnel Manager for Pi connectivity
  ssh-tunnel-manager:
    build:
      context: .
      dockerfile: Dockerfile.ssh-manager
    container_name: eq12-ssh-manager
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs
      - ./ssh_keys:/app/ssh_keys:ro
      - ./logs:/app/logs
    networks:
      - eq12-cluster
    environment:
      - SSH_KEY_PATH=/app/ssh_keys/eq12_cluster_key
      - CONNECTION_TIMEOUT=30
      - RETRY_INTERVAL=60

  # Distributed Data Processor
  data-processor:
    build:
      context: .
      dockerfile: Dockerfile.data-processor
    container_name: eq12-data-processor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    networks:
      - eq12-cluster
      - eq12-network
    environment:
      - REDIS_URL=redis://redis-cluster:6379
      - PROCESSING_WORKERS=4
      - BATCH_SIZE=100
    depends_on:
      - redis-cluster

  # Pi Network Scanner (discovers new Pi devices)
  network-scanner:
    build:
      context: .
      dockerfile: Dockerfile.network-scanner
    container_name: eq12-network-scanner
    restart: unless-stopped
    network_mode: host # Required for network scanning
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    environment:
      - SCAN_INTERVAL=300 # 5 minutes
      - AUTO_ADD_NODES=false
      - NOTIFICATION_WEBHOOK=${TELEGRAM_BOT_TOKEN}

  # Metrics Collector for cluster performance
  metrics-collector:
    image: prom/prometheus:latest
    container_name: eq12-cluster-metrics
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-cluster-data:/prometheus
    networks:
      - eq12-cluster
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  # Grafana Dashboard for cluster visualization
  grafana-cluster:
    image: grafana/grafana:latest
    container_name: eq12-cluster-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-cluster-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources
    networks:
      - eq12-cluster
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=eq12cluster
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    depends_on:
      - metrics-collector

  # Load Balancer for Pi services
  nginx-pi-proxy:
    image: nginx:alpine
    container_name: eq12-pi-proxy
    restart: unless-stopped
    ports:
      - "8883:80"
    volumes:
      - ./nginx/pi-cluster.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eq12-cluster
    depends_on:
      - eq12-pi-coordinator

volumes:
  redis-cluster-data:
    driver: local
  prometheus-cluster-data:
    driver: local
  grafana-cluster-data:
    driver: local

networks:
  eq12-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  eq12-network:
    external: true # Connect to existing EQ12 network

# Configuration for development/testing with Pi emulation
x-pi-emulator: &pi-emulator
  build:
    context: .
    dockerfile: Dockerfile.pi-emulator
  networks:
    - eq12-cluster
  environment:
    - PI_HOSTNAME=pi-emulator
    - CORAL_EMULATION=true
    - CPU_CORES=4
    - MEMORY_GB=8.0

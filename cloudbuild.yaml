# EQ12 Sports Betting Analytics - Cloud Build CI/CD Pipeline\n# Builds and deploys Jump Start Solutions: API, Scheduler, RAG, Knowledge Base services\n# Focus: Automated deployment with cost controls and security\n\nsteps:\n  # ================================\n  # BUILD PHASE - Container Images\n  # ================================\n  \n  # Build EQ12 API Service (Jump Start: Dynamic Web Application)\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'build-api'\n    args:\n      - 'build'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-api:$SHORT_SHA'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-api:latest'\n      - '-f'\n      - 'Dockerfile.api'\n      - '.'\n    env:\n      - 'DOCKER_BUILDKIT=1'\n\n  # Build EQ12 Scheduler Service\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'build-scheduler'\n    args:\n      - 'build'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-scheduler:$SHORT_SHA'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-scheduler:latest'\n      - '-f'\n      - 'Dockerfile.scheduler'\n      - '.'\n    env:\n      - 'DOCKER_BUILDKIT=1'\n\n  # Build EQ12 RAG Service (Jump Start: Generative AI RAG)\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'build-rag'\n    args:\n      - 'build'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-rag:$SHORT_SHA'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-rag:latest'\n      - '-f'\n      - 'Dockerfile.rag'\n      - '.'\n    env:\n      - 'DOCKER_BUILDKIT=1'\n\n  # Build EQ12 Knowledge Base Service (Jump Start: Generative AI Knowledge Base)\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'build-kb'\n    args:\n      - 'build'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-kb:$SHORT_SHA'\n      - '-t'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-kb:latest'\n      - '-f'\n      - 'Dockerfile.kb'\n      - '.'\n    env:\n      - 'DOCKER_BUILDKIT=1'\n\n  # ================================\n  # PUSH PHASE - Artifact Registry\n  # ================================\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'push-api'\n    args:\n      - 'push'\n      - '--all-tags'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-api'\n    waitFor: ['build-api']\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'push-scheduler'\n    args:\n      - 'push'\n      - '--all-tags'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-scheduler'\n    waitFor: ['build-scheduler']\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'push-rag'\n    args:\n      - 'push'\n      - '--all-tags'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-rag'\n    waitFor: ['build-rag']\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'push-kb'\n    args:\n      - 'push'\n      - '--all-tags'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-kb'\n    waitFor: ['build-kb']\n\n  # ================================\n  # DEPLOY PHASE - Cloud Run Services\n  # ================================\n\n  # Deploy API Service (Public endpoints)\n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'deploy-api'\n    args:\n      - 'gcloud'\n      - 'run'\n      - 'deploy'\n      - 'eq12-api'\n      - '--image'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-api:$SHORT_SHA'\n      - '--region'\n      - '${_REGION}'\n      - '--allow-unauthenticated'\n      - '--min-instances'\n      - '0'\n      - '--max-instances'\n      - '3'\n      - '--cpu'\n      - '1'\n      - '--memory'\n      - '512Mi'\n      - '--concurrency'\n      - '80'\n      - '--timeout'\n      - '300'\n      - '--service-account'\n      - 'eq12-runner@$PROJECT_ID.iam.gserviceaccount.com'\n      - '--set-env-vars'\n      - 'PROJECT_ID=$PROJECT_ID,DATASET_ID=eq12_dw,BUCKET_NAME=${_BUCKET_NAME}'\n      - '--vpc-connector'\n      - '${_REGION}:eq12-connector'\n    waitFor: ['push-api']\n\n  # Deploy Scheduler Service (Internal only)\n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'deploy-scheduler'\n    args:\n      - 'gcloud'\n      - 'run'\n      - 'deploy'\n      - 'eq12-scheduler'\n      - '--image'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-scheduler:$SHORT_SHA'\n      - '--region'\n      - '${_REGION}'\n      - '--no-allow-unauthenticated'\n      - '--min-instances'\n      - '0'\n      - '--max-instances'\n      - '1'\n      - '--cpu'\n      - '1'\n      - '--memory'\n      - '512Mi'\n      - '--timeout'\n      - '900'\n      - '--service-account'\n      - 'eq12-runner@$PROJECT_ID.iam.gserviceaccount.com'\n      - '--set-env-vars'\n      - 'PROJECT_ID=$PROJECT_ID'\n      - '--vpc-connector'\n      - '${_REGION}:eq12-connector'\n    waitFor: ['push-scheduler']\n\n  # Deploy RAG Service (Internal)\n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'deploy-rag'\n    args:\n      - 'gcloud'\n      - 'run'\n      - 'deploy'\n      - 'eq12-rag'\n      - '--image'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-rag:$SHORT_SHA'\n      - '--region'\n      - '${_REGION}'\n      - '--no-allow-unauthenticated'\n      - '--min-instances'\n      - '0'\n      - '--max-instances'\n      - '2'\n      - '--cpu'\n      - '1'\n      - '--memory'\n      - '1Gi'\n      - '--service-account'\n      - 'eq12-runner@$PROJECT_ID.iam.gserviceaccount.com'\n      - '--vpc-connector'\n      - '${_REGION}:eq12-connector'\n    waitFor: ['push-rag']\n\n  # Deploy Knowledge Base Service\n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'deploy-kb'\n    args:\n      - 'gcloud'\n      - 'run'\n      - 'deploy'\n      - 'eq12-kb'\n      - '--image'\n      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-kb:$SHORT_SHA'\n      - '--region'\n      - '${_REGION}'\n      - '--no-allow-unauthenticated'\n      - '--min-instances'\n      - '0'\n      - '--max-instances'\n      - '2'\n      - '--cpu'\n      - '1'\n      - '--memory'\n      - '1Gi'\n      - '--service-account'\n      - 'eq12-runner@$PROJECT_ID.iam.gserviceaccount.com'\n    waitFor: ['push-kb']\n\n  # ================================\n  # VALIDATION PHASE\n  # ================================\n\n  # Health check deployed services\n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'validate-deployment'\n    entrypoint: 'bash'\n    args:\n      - '-c'\n      - |\n        echo \"🔍 Validating EQ12 deployments...\"\n        \n        # Get service URLs\n        API_URL=$(gcloud run services describe eq12-api --region=${_REGION} --format=\"value(status.url)\")\n        \n        echo \"✅ API URL: $API_URL\"\n        \n        # Test API health endpoint\n        curl -f \"$API_URL/health\" || exit 1\n        \n        echo \"🎉 EQ12 deployment validation successful!\"\n    waitFor: ['deploy-api', 'deploy-scheduler', 'deploy-rag', 'deploy-kb']\n\n  # ================================\n  # INFRASTRUCTURE DEPLOYMENT (Optional)\n  # ================================\n\n  # Apply Terraform changes (manual approval required)\n  - name: 'hashicorp/terraform:1.6'\n    id: 'terraform-plan'\n    entrypoint: 'sh'\n    args:\n      - '-c'\n      - |\n        cd infra\n        terraform init\n        terraform plan -var=\"project_id=$PROJECT_ID\" -var=\"region=${_REGION}\" -var=\"bucket_name=${_BUCKET_NAME}\"\n    waitFor: ['-']\n\n# ================================\n# ARTIFACTS AND IMAGES\n# ================================\n\nimages:\n  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-api:$SHORT_SHA'\n  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-scheduler:$SHORT_SHA'\n  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-rag:$SHORT_SHA'\n  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eq12-docker/eq12-kb:$SHORT_SHA'\n\n# ================================\n# CONFIGURATION\n# ================================\n\n# Build timeout (20 minutes)\ntimeout: '1200s'\n\n# Resource allocation\noptions:\n  machineType: 'E2_HIGHCPU_8'\n  diskSizeGb: '100'\n  \n# Substitutions (build variables)\nsubstitutions:\n  _REGION: 'us-central1'\n  _BUCKET_NAME: 'eq12-deliverables'\n  _ENVIRONMENT: 'prod'\n\n# ================================\n# COST AND SECURITY CONTROLS\n# ================================\n\n# Available triggers:\n# - Manual trigger for production deployments\n# - GitHub webhook for automated staging deployments\n# - Scheduled builds for dependency updates\n\n# Build logs retention: 30 days\n# Build artifacts: retained in Artifact Registry with lifecycle policies\n# Service accounts: least privilege principle enforced\n# Network: VPC connector for secure Cloud SQL access\n# Secrets: managed through Secret Manager, never in build logs

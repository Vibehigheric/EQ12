<html>
<head>
    <title>CNET Shopping Extension Options</title>
    <link rel="stylesheet" type="text/css" href="/css/options.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 class="Settings">Settings</h2>
      <hr/>
      <div class="country-settings">
        <span class="hdr2">Country</span>
        <span class="grey_text">Please select your country, so we can find the best savings.</span>
        <div class="inner-container">
          <span class="radio-country">
            <input type="radio" name="country" value="us" class="option" id="us"><label>United States (US)</label>
          </span>
          <span class="radio-country">
            <input type="radio" name="country" value="uk" class="option" id="uk"><label>United Kingdom (UK)</label>
          </span>
        </div>
      </div>
    </div>
    <p id="status" style="display: none;"></p>
    <div class="member-settings">
      <hr/>
      <span class="hdr2">Membership </span>
      <span class="grey_text">Let us know your membership status, so we can show you member-exclusive prices.</span>
      <div class="inner-container">
        <span class="checkbox">
          <input type="checkbox" name="walmartplus" value="1" class="wPlusCheckbox"><label>Walmart+</label>
        </span>
      </div>
    </div>
    <div class="cashback-settings">
      <hr/>
      <span class="hdr2">See Earnings </span>
      <span class="grey_text"><a href="https://shopping.cnet.com/dashboard/cashback-earnings.php" target="_blank">Cashback Earnings</a></span>
    </div>
    <div id="help">
      <hr/>
      <a href="https://invisiblehand.zendesk.com/hc/en-us" target="_blank">Get help</a>
    </div>
    <div id="privacy">
      <hr/>
      <a href="https://www.ziffdavis.com/ztg-privacy-policy" target="_blank">Privacy Policy</a>
    </div>
    <div id="termsUse">
      <hr/>
      <a href="https://www.ziffdavis.com/terms-of-use" target="_blank">Terms of Use</a>
    </div>
    <div class="disabledRetailersCashback">
      <hr/>
      <span class="grey_text"></span>
    </div>
  </div>
</body>
<script src="../js/options.js"></script>
</html>

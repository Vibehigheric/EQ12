<html>
  <head>
    <title>CNET Shopping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/cashback.css">
</head>
<body>
<div class="cashback_popup optionPage" id="cashback_popup">
  <div class="cashback_popup_header">
    <div class="cnet-logo">
      <img src="/images/cnet-shopping-logo.svg"/>
    </div>
  </div>
  <div class="cashback_popup_content">
    <div class="cashback_head">
      <img class="cashback_head_image"/>
    </div>
    <div class="cashback_message">
      Processing...
    </div>
  </div>
  <div class="cashback_popup_footer">
    <div class="cashback_steps">
      <div class="cashback_steps-rewards hide">
        View Rewards
      </div>
      <div class="cashback_steps-details hide">Offer Details & Terms
      </div>
      <div class="cashback_steps-Close hide closecashback">Skip
      </div>
    </div>
  </div>
</div>
</body>
<script src="../js/oauth.js"></script>
</html>

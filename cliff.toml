[changelog]
# git-cliff configuration for EQ12 project
# Generates beautiful changelogs from conventional commits

header = """
# EQ12 Changelog

All notable changes to the EQ12 betting dashboard and browser extensions will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- **{{ commit.scope }}**: {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repository_url }}/commit/{{ commit.id }}))
{%- else -%}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repository_url }}/commit/{{ commit.id }}))
{%- endif %}
{% endfor %}
{% endfor %}

"""

footer = """
<!-- generated by git-cliff -->
"""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # Replace issue numbers with links
    { pattern = '\((\w+)\)', replace = "([${1}](https://github.com/Vibehigheric/edgegod-parlay/issues/${1}))"},
]
# regex for parsing and grouping commits
commit_parsers = [
    # EQ12 Custom Types
    { message = "^bet", group = "🎯 Betting Logic" },
    { message = "^agent", group = "🤖 Multi-Agent System" },
    { message = "^ext", group = "🦊 Browser Extensions" },
    { message = "^parlay", group = "🎟️ Parlay Generation" },
    { message = "^ev", group = "📊 Expected Value" },
    { message = "^risk", group = "💰 Risk Management" },
    { message = "^vpn", group = "🔒 VPN & Security" },
    { message = "^telegram", group = "📱 Telegram Bot" },
    { message = "^audit", group = "📋 Audit & Compliance" },

    # Standard Types
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactoring" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^docs", group = "📖 Documentation" },
    { message = "^build", group = "🔨 Build System" },
    { message = "^ci", group = "🔄 CI/CD" },
    { message = "^infra", group = "🏗️ Infrastructure" },
    { message = "^chore", group = "🧹 Maintenance" },
    { message = "^deps", group = "📦 Dependencies" },

    # Skip certain commits from changelog
    { message = "^chore\\(release\\):", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^Merge", skip = true },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = "v0.1.0-beta.1"
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"

# Docker Compose for EdgeGod Expert Engine
version: '3.8'

services:
  edgegod-engine:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: edgegod-expert-engine
    ports:
      - "8080:8080"
    environment:
      - ODDS_API_KEY=${ODDS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BANKROLL_BASE=${BANKROLL_BASE:-1000}
      - MAX_SINGLE_BET_PERCENTAGE=${MAX_SINGLE_BET_PERCENTAGE:-0.05}
      - MIN_EDGE_THRESHOLD=${MIN_EDGE_THRESHOLD:-0.02}
      - KELLY_FRACTION=${KELLY_FRACTION:-0.25}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - EQ12_LOGS=/app/logs
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - edgegod-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: edgegod-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - edgegod-engine
    networks:
      - edgegod-network
    profiles:
      - production

networks:
  edgegod-network:
    driver: bridge
# EQ12 Global DNS Policy
PRIMARY_DNS=192.168.100.1     # EQ12 Manager resolver
SECONDARY_DNS=1.1.1.1         # Cloudflare fallback
TERTIARY_DNS=8.8.8.8          # Google fallback

# API domains for sports betting
PINNED_API_DOMAINS=(
    "api.the-odds-api.com"
    "api.sportsdata.io"
    "api.bovada.lv"
    "api.draftkings.com"
    "api.fanduel.com"
    "sportsbook.draftkings.com"
)

DNS_CACHE_TTL=60               # 1 minute; best for rapidly changing odds
DNS_PREFETCH_API=true
DNS_PREFETCH_INTERNAL=true
DNS_HEALTHCHECK_INTERVAL=30
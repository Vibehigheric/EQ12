
<!DOCTYPE html>
<html>
<head>
    <title>EQ12 Sales Dashboard</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .title {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .metric-value {
            font-size: 42px;
            font-weight: bold;
            color: #00ff88;
            margin: 20px 0;
        }
        .metric-label {
            font-size: 20px;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        .change {
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .positive { background: #00ff8840; color: #00ff88; }
        .negative { background: #ff444440; color: #ff4444; }
        .live-ticker {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            animation: scroll 30s linear infinite;
        }
        @keyframes scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
    <meta http-equiv="refresh" content="60">
</head>
<body>
    <div class="title">📈 EQ12 SALES DASHBOARD</div>
    
    <div class="dashboard">
        {% for metric in metrics %}
        <div class="metric-card">
            <div class="metric-label">{{ metric.label }}</div>
            <div class="metric-value">{{ metric.value }}</div>
            <div class="change {{ 'positive' if metric.change > 0 else 'negative' }}">
                {{ '+' if metric.change > 0 else '' }}{{ metric.change }}%
            </div>
        </div>
        {% endfor %}
        
        <div class="live-ticker">
            <div class="ticker-content">
                {{ ticker_message }}
            </div>
        </div>
    </div>
</body>
</html>

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgefinder"
version = "1.0.0"
description = "Ethical reconnaissance tool for discovering public GitHub and Hugging Face repositories to enhance EQ12 system"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "EQ12 Development Team", email = "dev@eq12.local"}
]
maintainers = [
    {name = "EQ12 Development Team", email = "dev@eq12.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
keywords = ["security", "reconnaissance", "github", "huggingface", "static-analysis", "license-compliance"]
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
    "tenacity>=8.0.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "semgrep>=1.0.0",
]
analysis = [
    "pylint>=2.15.0",
    "radon>=5.1.0",
    "vulture>=2.6.0",
    "mccabe>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/eq12/edgefinder"
Repository = "https://github.com/eq12/edgefinder"
Documentation = "https://github.com/eq12/edgefinder/blob/main/README.md"
Changelog = "https://github.com/eq12/edgefinder/blob/main/CHANGELOG.md"

[project.scripts]
edgefinder = "edgefinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgefinder = ["py.typed", "*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | downloads
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["edgefinder"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "bs4.*",
    "lxml.*",
    "git.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests as requiring network access",
    "security: marks tests as security-focused",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "downloads"]
skips = ["B101", "B601"]  # Skip assert_used and shell injection (we control the inputs)

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
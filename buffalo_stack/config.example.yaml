# Buffalo Stack Configuration
# Copy this to config/config.yaml and customize

# ========================================
# General Settings
# ========================================
general:
  name: "Buffalo Stack EQ12 Integration"
  version: "1.0.0"
  debug: false
  timezone: "America/New_York"

# ========================================
# Civil Service Tracker
# ========================================
civil_service:
  enabled: true
  check_interval_hours: 1
  
  # Job search criteria
  keywords:
    - "police officer"
    - "firefighter"
    - "emt"
    - "paramedic"
    - "911 dispatcher"
    - "correctional officer"
    - "court clerk"
    - "public works"
  
  union_codes:
    - "14215"
    - "14216"
    - "14217"
  
  # Data sources (customize these URLs for your area)
  sources:
    - name: "City Jobs Portal"
      url: "https://www.governmentjobs.com/careers/cityname"
      type: "web_scrape"
      enabled: false  # Disabled by default - customize URL first
    
    - name: "County HR"
      url: "https://www.countyname.gov/jobs"
      type: "web_scrape"
      enabled: false  # Disabled by default - customize URL first
    
    - name: "State Civil Service"
      url: "https://www.cs.ny.gov/jobseeker/"
      type: "api"
      enabled: false  # Disabled by default - needs API setup

# ========================================
# Notifications
# ========================================
notifications:
  telegram:
    enabled: true
    send_summaries: true
    send_individual_jobs: false
  
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender: "your_email@gmail.com"
    recipients:
      - "recipient@email.com"

# ========================================
# EQ12 Integration
# ========================================
eq12:
  enabled: true
  
  # Modules to run
  modules:
    civil_tracker: true
    betting_bot: false    # Set to true if you have betting automation
    travel_bot: false     # Set to true if you have travel automation
    dropship_sync: false  # Set to true if you have dropship automation
  
  # ChatGPT Integration
  chatgpt:
    enabled: true
    model: "gpt-4o-mini"
    max_tokens: 2048
    temperature: 0.2

# ========================================
# Logging
# ========================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  max_file_size_mb: 10
  backup_count: 5
  
  # Log destinations
  console: true
  file: true
  
  # Log format
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# ========================================
# Database
# ========================================
database:
  type: "sqlite"  # Currently only SQLite supported
  path: "civil_service_jobs.db"
  backup_enabled: true
  backup_interval_days: 7

# ========================================
# Security
# ========================================
security:
  encrypt_api_keys: false  # Future feature
  rate_limiting: true
  max_requests_per_hour: 100

# ========================================
# Performance
# ========================================
performance:
  max_concurrent_requests: 5
  request_delay_seconds: 1
  cache_enabled: true
  cache_ttl_minutes: 30
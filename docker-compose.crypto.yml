# EQ12 Coral Crypto Intelligence Stack
# Docker Compose Configuration

version: "3.9"

services:
  eq12-coral-crypto-ai:
    build:
      context: .
      dockerfile: Dockerfile.crypto
    container_name: eq12-coral-crypto-ai
    restart: unless-stopped
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./feeds:/app/feeds
    devices:
      # Coral USB Accelerator access
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - COINBASE_API_KEY=${COINBASE_API_KEY}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET}
      - COINBASE_PASSPHRASE=${COINBASE_PASSPHRASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD}
    networks:
      - crypto-network
    ports:
      - "8080:8080" # Dashboard port
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  eq12-crypto-stream:
    build:
      context: .
      dockerfile: Dockerfile.crypto
    container_name: eq12-crypto-stream
    restart: unless-stopped
    command: ["python", "eq12_crypto_stream.py"]
    volumes:
      - ./feeds:/app/feeds
      - ./logs:/app/logs
      - ./configs:/app/configs
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - COINBASE_API_KEY=${COINBASE_API_KEY}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET}
    networks:
      - crypto-network
    depends_on:
      - redis
      - postgres

  eq12-alerts:
    build:
      context: .
      dockerfile: Dockerfile.crypto
    container_name: eq12-alerts
    restart: unless-stopped
    command: ["python", "eq12_alerts.py"]
    volumes:
      - ./logs:/app/logs
      - ./configs:/app/configs
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD}
    networks:
      - crypto-network
    depends_on:
      - redis

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: eq12-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crypto-network
    command: redis-server --appendonly yes

  # PostgreSQL for data storage
  postgres:
    image: postgres:15-alpine
    container_name: eq12-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=eq12_crypto
      - POSTGRES_USER=eq12_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eq12_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - crypto-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: eq12-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - crypto-network
    depends_on:
      - postgres

  # InfluxDB for time series data
  influxdb:
    image: influxdb:2.0
    container_name: eq12-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - INFLUXDB_DB=eq12_crypto
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD:-influx_secure_password}
    networks:
      - crypto-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: eq12-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - crypto-network
    depends_on:
      - eq12-coral-crypto-ai
      - grafana

volumes:
  redis-data:
  postgres-data:
  grafana-data:
  influxdb-data:

networks:
  crypto-network:
    driver: bridge

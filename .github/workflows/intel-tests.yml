name: Intel RAG Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 4 * * 1' # weekly on Monday 04:00 UTC

jobs:
  run-intel-rag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps (apt)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libssl-dev libffi-dev

      - name: Install pip requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run secrets check (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "./scripts/eq12-secrets-check.ps1"

      - name: Run Intel demo
        run: |
          mkdir -p logs
          python scripts/intel_rag_demo.py --out-json logs/intel_test.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: intel-test-json
          path: logs/intel_test.json

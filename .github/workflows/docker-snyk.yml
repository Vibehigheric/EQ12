name: Docker Build & Snyk Container Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_NAME: eq12/app:latest
      SNYK_ORG: 2563a942-79c3-4241-a0db-659ec1520291
    steps:
      - uses: actions/checkout@v4

      - name: Respect budget gate
        run: |
          if [ "${{ secrets.ACTIONS_BUDGET_LOCK }}" = "1" ]; then
            echo "Budget lock engaged; exiting." && exit 0;
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}

      - name: Save image to tar
        run: |
          docker save $IMAGE_NAME -o image.tar

      - name: Install Snyk CLI
        run: |
          curl -sSfL https://static.snyk.io/cli/latest/snyk-linux -o snyk
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk
          snyk --version

      - name: Snyk container test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          docker load -i image.tar
          snyk container test $IMAGE_NAME --severity-threshold=medium --org="$SNYK_ORG" --sarif-file-output=snyk-container.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif

      - name: Snyk container monitor (on main only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container monitor $IMAGE_NAME --org="$SNYK_ORG" || true

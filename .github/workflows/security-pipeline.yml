name: EQ12 Security Pipeline

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      scan_type:
        description: Security scan type
        required: false
        default: full
        type: choice
        options:
          - full
          - quick
          - compliance

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  security-validation:
    name: Security validation
    runs-on: ubuntu-latest
    outputs:
      security_score: ${{ steps.score.outputs.score }}
      critical_issues: ${{ steps.score.outputs.critical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Verify recent commit signatures
        id: commits
        shell: bash
        run: |
          unsigned=0
          git rev-list --max-count=10 HEAD | while read -r commit; do
            if git verify-commit "$commit" >/dev/null 2>&1; then
              echo "signed $commit"
            else
              echo "unsigned $commit"
              unsigned=$((unsigned + 1))
            fi
          done
          echo "unsigned=${unsigned}" >> "$GITHUB_OUTPUT"

      - name: Run Bandit
        shell: bash
        run: |
          bandit -q -r . -f json -o bandit-report.json || true

      - name: Run pip-audit when requirements exist
        if: hashFiles('**/requirements*.txt') != ''
        shell: bash
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json || true

      - name: Check security support files
        id: score
        shell: bash
        run: |
          score=100
          critical=0
          warnings=()

          for required_file in SECURITY.md .github/CODEOWNERS .github/dependabot.yml; do
            if [ ! -f "$required_file" ]; then
              warnings+=("$required_file missing")
              score=$((score - 5))
            fi
          done

          unsigned="${{ steps.commits.outputs.unsigned }}"
          if [ -n "$unsigned" ] && [ "$unsigned" -gt 0 ]; then
            score=$((score - (unsigned * 5)))
            critical=1
          fi

          {
            echo "score=$score"
            echo "critical=$critical"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Security validation"
            echo "- Score: $score"
            echo "- Critical issues: $critical"
            echo "- Unsigned commits in last 10: ${unsigned:-0}"
            if [ "${#warnings[@]}" -gt 0 ]; then
              echo "- Warnings:"
              printf '  - %s\n' "${warnings[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-validation-artifacts
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: ignore

  codeql-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  security-reporting:
    name: Security reporting
    runs-on: ubuntu-latest
    needs: [security-validation, codeql-analysis]
    if: always()
    steps:
      - name: Write report
        shell: bash
        run: |
          cat > security-report.md <<EOF
          # EQ12 Security Report

          - Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - Commit: ${{ github.sha }}
          - Security score: ${{ needs.security-validation.outputs.security_score }}
          - Critical issues: ${{ needs.security-validation.outputs.critical_issues }}
          - CodeQL: completed
          EOF

          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-report
          path: security-report.md
          if-no-files-found: error

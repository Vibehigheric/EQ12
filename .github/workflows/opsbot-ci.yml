name: EQ12 OpsBot CI

on:
    push:
        branches: [main, develop]
        paths:
            - "eq12_opsbot/**"
            - "tests/opsbot/**"
            - "requirements_opsbot.txt"
            - ".github/workflows/opsbot-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "eq12_opsbot/**"
            - "tests/opsbot/**"
            - "requirements_opsbot.txt"

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [3.12]

        steps:
            - uses: actions/checkout@v4
              with:
                  # Fetch full history for signed commit verification
                  fetch-depth: 0

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('requirements_opsbot.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_opsbot.txt

            - name: Lint with ruff
              run: |
                  # Install ruff if not in requirements
                  pip install ruff
                  # Check for syntax errors, undefined names, and style issues
                  ruff check eq12_opsbot/ tests/opsbot/ --select=E9,F63,F7,F82
                  # Full linting (allow to fail but report)
                  ruff check eq12_opsbot/ tests/opsbot/ || true

            - name: Format check with black (informational)
              run: |
                  pip install black
                  black --check eq12_opsbot/ tests/opsbot/ || echo "Code formatting suggestions available"

            - name: Type check with mypy (optional)
              continue-on-error: true
              run: |
                  pip install mypy types-requests types-PyYAML
                  mypy eq12_opsbot/ --ignore-missing-imports || echo "Type checking completed with warnings"

            - name: Test with pytest
              run: |
                  pytest tests/opsbot/ -v --tb=short
              env:
                  # Mock environment for testing
                  OPENAI_API_KEY: sk-test-key-for-ci
                  OPENAI_WEBHOOK_SECRET: test-webhook-secret-ci
                  EQ12_BUDGET_DAILY: "5"
                  EQ12_BUDGET_MONTHLY: "120"
                  LOG_LEVEL: DEBUG

            - name: Test OpsBot CLI commands (smoke test)
              run: |
                  # Test CLI help and basic functionality
                  python -m eq12_opsbot.main --help
                  python -m eq12_opsbot.main doctor || echo "Doctor command completed"
              env:
                  OPENAI_API_KEY: sk-test-key-for-ci
                  EQ12_BUDGET_DAILY: "1"
                  EQ12_BUDGET_MONTHLY: "30"

            - name: Security scan with bandit (informational)
              continue-on-error: true
              run: |
                  pip install bandit
                  bandit -r eq12_opsbot/ -f json -o bandit-report.json || true
                  cat bandit-report.json || echo "Security scan completed"

    docker-test:
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Test Docker-like environment
              run: |
                  # Simulate container environment for OpsBot
                  python -c "
                  import sys
                  print(f'Python version: {sys.version}')

                  # Test OpsBot imports work
                  try:
                      from eq12_opsbot.config import OpsConfig
                      from eq12_opsbot.server import create_app
                      print('✅ OpsBot imports successful')
                  except ImportError as e:
                      print(f'❌ Import error: {e}')
                      sys.exit(1)

                  # Test basic configuration
                  try:
                      config = OpsConfig()
                      print(f'✅ Config loaded: {config.service_name}')
                  except Exception as e:
                      print(f'⚠️  Config warning: {e}')

                  print('Docker compatibility test passed')
                  "
              env:
                  OPENAI_API_KEY: sk-docker-test-key
                  EQ12_BUDGET_DAILY: "2"

    integration-test:
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'pull_request'

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v4
              with:
                  python-version: 3.12

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_opsbot.txt

            - name: Integration test with existing EQ12 components
              run: |
                  # Test OpsBot integrates gracefully with missing EQ12 modules
                  python -c "
                  import sys
                  sys.path.insert(0, '.')

                  try:
                      from eq12_opsbot.budget_guard import BudgetGuard
                      from eq12_opsbot.rate_limits import RateLimiter
                      from eq12_opsbot.model_policy import ModelPolicy

                      # Test graceful fallback when EQ12 modules missing
                      budget = BudgetGuard()
                      print('✅ Budget guard initialized with fallback')

                      limiter = RateLimiter()
                      print('✅ Rate limiter initialized')

                      policy = ModelPolicy()
                      print('✅ Model policy initialized')

                      # Test health check integration
                      from eq12_opsbot.server import create_app
                      app = create_app()
                      print('✅ FastAPI app created successfully')

                      print('Integration test passed - OpsBot ready for production')

                  except Exception as e:
                      print(f'❌ Integration test failed: {e}')
                      sys.exit(1)
                  "
              env:
                  OPENAI_API_KEY: sk-integration-test-key
                  EQ12_BUDGET_DAILY: "3"
                  EQ12_BUDGET_MONTHLY: "90"

    verify-signed-commits:
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify commit signatures (informational)
              continue-on-error: true
              run: |
                  # Check if recent commits are signed
                  echo "Checking commit signatures for EQ12 OpsBot changes..."
                  git log --pretty="format:%H %G? %s" -10 | while read commit status subject; do
                    case "$status" in
                      G) echo "✅ $commit: $subject (Good signature)" ;;
                      B) echo "⚠️  $commit: $subject (Bad signature)" ;;
                      U) echo "⚠️  $commit: $subject (Untrusted signature)" ;;
                      X) echo "❌ $commit: $subject (Expired signature)" ;;
                      Y) echo "❌ $commit: $subject (Expired key)" ;;
                      R) echo "❌ $commit: $subject (Revoked key)" ;;
                      E) echo "❌ $commit: $subject (Cannot check)" ;;
                      N) echo "🔍 $commit: $subject (No signature)" ;;
                      *) echo "❓ $commit: $subject (Unknown status: $status)" ;;
                    esac
                  done

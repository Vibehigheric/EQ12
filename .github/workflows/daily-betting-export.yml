name: Daily Betting Slips Export

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/eq12_export_betting_slips.py'
      - '.github/workflows/daily-betting-export.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  export-betting-slips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests python-dotenv

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Prepare export directories
        run: mkdir -p exports logs reports

      - name: Generate betting slips
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/eq12_export_betting_slips.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add exports/
          git commit -m "chore: auto-generate daily betting slips - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push origin HEAD:${{ github.ref_name }}

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## Daily Betting Export Summary"
            echo
            echo "- Execution time: $(date -u)"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Export path: \`exports/betting_slips/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: betting-export-logs
          path: |
            logs/
            exports/
          if-no-files-found: ignore
          retention-days: 7

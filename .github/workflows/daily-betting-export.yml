name: Daily Betting Slips Export

on:
  schedule:
    # Run every day at 9 AM UTC (3 AM EST, 4 AM EDT)
    - cron: '0 9 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
  
  # Also run on push to main for immediate verification
  push:
    branches:
      - main
    paths:
      - 'scripts/eq12_export_betting_slips.py'
      - 'scripts/eq12_betting_slips_manager.py'
      - '.github/workflows/daily-betting-export.yml'

permissions:
  contents: write  # Write permission for commits
  pull-requests: write  # For creating/updating PRs

jobs:
  export-betting-slips:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests python-dotenv
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Generate betting slips
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/eq12_export_betting_slips.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in exports"
            git status
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add exports/
          git commit -m "chore: auto-generate daily betting slips - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push origin main
      
      - name: Generate summary
        if: always()
        run: |
          echo "## Daily Betting Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -d "exports" ]; then
            echo "**Files Generated**:" >> $GITHUB_STEP_SUMMARY
            ls -la exports/ 2>/dev/null | tail -20 >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: betting-export-logs
          path: logs/
          retention-days: 7

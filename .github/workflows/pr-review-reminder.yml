name: PR Review Reminder

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create review checklist issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prAuthor = context.payload.pull_request.user.login;

            const issueTitle = `PR Review Checklist for #${prNumber}`;
            const issueBody = [
              "# EQ12 PR Review Checklist",
              "",
              `This issue is automatically linked to PR **#${prNumber}**: ${prTitle}.`,
              "Before merge, run GitHub Copilot Chat with the prompts in `COPILOT_REVIEW.md`.",
              "",
              "## Gates",
              "- [ ] Secrets Gate - `check-secrets.yml`",
              "- [ ] Security Gate - `security-scan.yml`",
              "- [ ] CI/Test Gate - `ci.yml`",
              "- [ ] Compliance Gate - PR templates + CODEOWNERS",
              "",
              "## Sensitive Modules",
              "If the PR touches `betting/`, `cannabis/`, or `credit/`, run the sensitive module review prompts.",
              "",
              "## Reviewer Action",
              "- [ ] Copilot review completed",
              "- [ ] All governance gates green",
              "- [ ] Sensitive module compliance confirmed if applicable",
              "",
              `PR author: @${prAuthor}`,
            ].join("\n");

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["governance", "review-needed"],
              assignees: ["Vibehigheric"],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                "Governance review checklist created.",
                "",
                `- Linked issue: #${issue.data.number}`,
                "- Run Copilot review prompts from `COPILOT_REVIEW.md`.",
                "- Complete the checklist before merge.",
              ].join("\n"),
            });

      - name: Write summary
        run: |
          {
            echo "## PR review reminder"
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Author: @${{ github.event.pull_request.user.login }}"
          } >> "$GITHUB_STEP_SUMMARY"

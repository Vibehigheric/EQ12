name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: Minutes budget gate
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    env:
      GITLENS_LICENSE_KEY: ${{ secrets.GITLENS_LICENSE_KEY }}
    steps:
      - id: gate
        shell: bash
        run: |
          # Toggle this via org/repo secret ACTIONS_BUDGET_LOCK=1 when near minute limits
          if [ "${{ secrets.ACTIONS_BUDGET_LOCK }}" = "1" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Budget lock engaged; skipping heavy jobs."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  lint_test:
    name: Lint, Security Scan, Tests
    needs: budget
    if: needs.budget.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLENS_LICENSE_KEY: ${{ secrets.GITLENS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff bandit pip-audit

      - name: Ruff (lint)
        run: ruff check . --output-format=github | tee ruff-report.txt || true

      - name: Bandit (security)
        run: bandit -q -r . -f json -o bandit-report.json || true

      - name: pip-audit (vulns)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          else
            echo "requirements.txt not found; skipping pip-audit."
          fi

      - name: Run tests (pytest if present)
        run: |
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -d tests ]; then
            pip install pytest
            pytest -q || true
          fi

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ruff-report.txt
            bandit-report.json
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        run: |
          {
            echo "## CI"
            echo "- Ruff report: ruff-report.txt"
            echo "- Bandit report: bandit-report.json"
            echo "- Tests: non-blocking smoke mode"
          } >> "$GITHUB_STEP_SUMMARY"

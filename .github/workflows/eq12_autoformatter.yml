name: EQ12 Auto-Formatter and Code Quality

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  python-format-audit:
    name: Python format audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: Discover parseable Python files
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          roots = [Path("scripts"), Path("src"), Path("tests")]
          valid = []
          invalid = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.py"):
                  if any(part in {".git", ".venv", "__pycache__", "profiles"} for part in path.parts):
                      continue
                  try:
                      ast.parse(path.read_text(encoding="utf-8"))
                      valid.append(path.as_posix())
                  except Exception as exc:
                      invalid.append(f"{path.as_posix()}: {exc}")

          Path("python_format_targets.txt").write_text("\n".join(valid) + ("\n" if valid else ""), encoding="utf-8")
          Path("python_invalid_syntax.txt").write_text("\n".join(invalid) + ("\n" if invalid else ""), encoding="utf-8")
          print(f"valid={len(valid)} invalid={len(invalid)}")
          PY

      - name: Run Black and isort on parseable files
        shell: bash
        run: |
          if [ -s python_format_targets.txt ]; then
            mapfile -t targets < python_format_targets.txt
            black --line-length 88 --target-version py312 --check --diff "${targets[@]}" || true
            isort --profile black --check-only --diff "${targets[@]}" || true
          else
            echo "No parseable Python files discovered."
          fi

      - name: Upload Python format artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq12-python-format-audit
          path: |
            python_format_targets.txt
            python_invalid_syntax.txt
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Python format audit"
            echo "- Targets file: python_format_targets.txt"
            echo "- Invalid syntax report: python_invalid_syntax.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  powershell-format-audit:
    name: PowerShell format audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell formatter
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $results = @()
          if (Test-Path scripts) {
            Get-ChildItem -Path scripts -Filter *.ps1 -Recurse -File | ForEach-Object {
              $results += Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error
            }
          }
          $results | ConvertTo-Json -Depth 4 | Set-Content -Path powershell-analysis.json -Encoding ASCII

      - name: Upload PowerShell analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq12-powershell-format-audit
          path: powershell-analysis.json
          if-no-files-found: ignore

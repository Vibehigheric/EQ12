name: EQ12 CI Guardian
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  gpg-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify last commit signature
        run: |
          git log --show-signature -1
          if ! git log --show-signature -1 | grep -qi "Good signature"; then
            echo "::error::Commit is not GPG-signed"
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install pytest
          pytest -q || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: eq12-py-logs
          path: logs/**/*.json
          if-no-files-found: ignore

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser
      - name: Run Pester
        shell: pwsh
        run: |
          if (Test-Path .\tests\pester) { Invoke-Pester -Path .\tests\pester -Output Detailed }
name: EQ12 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC - build dashboard snapshot
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-{{ hashFiles('**/requirements.txt') }}


      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system deps for Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libpangocairo-1.0-0 libgtk-3-0 libgbm1 || true

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Upload pytest artifacts (logs/tests)
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            logs
            .pytest_cache

  test-powershell:
    runs-on: windows-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Script "scraper_starter/tests/pester" -OutputFormat NUnitXml -PassThru
      - name: Upload Pester artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pester-logs
          path: scraper_starter/tests/pester

  verify-signature:
    runs-on: ubuntu-latest
    needs: [test-python, test-powershell]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GPG
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg

      - name: Import public keys from repo (keys/*.asc)
        run: |
          if [ -d keys ]; then for f in keys/*.asc; do echo "Importing $f"; gpg --import "$f"; done; fi

      - name: Import public keys from secret EQ12_PUBLIC_KEYS
        if: ${{ secrets.EQ12_PUBLIC_KEYS != '' }}
        run: |
          echo "${{ secrets.EQ12_PUBLIC_KEYS }}" > /tmp/eq12_keys.asc
          gpg --import /tmp/eq12_keys.asc

      - name: Show last commit signature
        run: git --no-pager log --show-signature -1

      - name: Upload git signature output
        run: git --no-pager log --show-signature -1 > signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: commit-signature
          path: signature.txt

  nightly-dashboard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-{{ hashFiles('**/requirements.txt') }}

      - name: Install requirements & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Run dashboard snapshot
        run: |
          mkdir -p logs
          python scripts/templates/python_scraper_template.py --out-json logs/dashboard_snapshot.json
      - name: Upload dashboard snapshot and logs
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-snapshot-and-logs
          path: |
            logs/dashboard_snapshot.json
            logs

name: EQ12 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run pytest
        run: |
          pytest -q || true

  windows-pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Script "scraper_starter/tests/pester" -Verbose || true

  verify-signature:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - name: Import public keys and show last signature
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg || true
          for f in keys/*.asc; do echo "Importing $f"; gpg --import "$f" || true; done
          git --no-pager log --show-signature -1 || true
name: EQ12 CI - Python + PowerShell + GPG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-path: ${{ steps.python_path.outputs.python-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: python_path
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  python-tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pytest
        run: |
          pytest -q || true

  powershell-tests:
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck
        shell: powershell
      - name: Run Pester tests
        run: |
          Invoke-Pester -Verbose
        shell: powershell

  verify-signature:
    needs: [python-tests, powershell-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
      - name: Import repository public keys
        run: |
          if [ -d keys ]; then for f in keys/*.asc; do gpg --import "$f" || true; done; fi
      - name: Show last commit signature
        run: |
          git log --show-signature -1 || true

name: EQ12 CI Guardian

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest

      - name: Run pytest if tests exist
        run: |
          if [ -d tests ]; then
            pytest -q || true
          else
            echo "No tests directory found."
          fi

  powershell-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester if available
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          if (Test-Path .\tests\pester) {
            Invoke-Pester -Path .\tests\pester -OutputFormat NUnitXml -OutputFile pester-results.xml
          }

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq12-ci-pester-results
          path: pester-results.xml
          if-no-files-found: ignore

  signature-summary:
    runs-on: ubuntu-latest
    needs: [python-smoke, powershell-smoke]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show last commit signature
        run: git --no-pager log --show-signature -1 || true

      - name: Write summary
        run: |
          {
            echo "## EQ12 CI Guardian"
            echo "- Python smoke: completed"
            echo "- PowerShell smoke: completed"
            echo "- Signature check: completed"
          } >> "$GITHUB_STEP_SUMMARY"

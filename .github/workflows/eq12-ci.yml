name: EQ12 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
        shell: bash

      - name: Run pytest
        run: |
          python -m pytest -q || exit 1
        shell: bash

      - name: Run Pester on Windows
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -Command "Install-Module -Name Pester -Force -Scope CurrentUser; Invoke-Pester -Script 'C:\EQ12\tests\pester\*.Tests.ps1' -Output Detailed"

      - name: Build dashboard (if present)
        run: |
          if [ -f ./scripts/eq12_build_dashboard.ps1 ]; then pwsh -File ./scripts/eq12_build_dashboard.ps1; fi
        shell: bash

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: eq12-logs
          path: |
            C:/EQ12/logs
            ./logs

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
name: EQ12 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # nightly snapshot

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install Playwright deps
        run: |
          sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libpangocairo-1.0-0 libgtk-3-0 libgbm1 || true
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps || true
      - name: Run pytest
        run: |
          python -m pytest -q || true

  test-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Pester tests
        shell: pwsh
        run: |
          if (Test-Path .\tests\pester) { Invoke-Pester -Path .\tests\pester -OutputFormat NUnitXml -OutputFile pester-results.xml }
      - name: Upload Pester Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml

  verify-signature:
    runs-on: ubuntu-latest
    needs: [test-python, test-powershell]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GPG
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg || true
      - name: Import public keys from repo
        run: |
          if [ -d keys ]; then for f in keys/*.asc; do echo "Importing $f"; gpg --import "$f" || true; done; fi
      - name: Import public keys from secret EQ12_PUBLIC_KEYS
        if: ${{ secrets.EQ12_PUBLIC_KEYS != '' }}
        run: |
          echo "${{ secrets.EQ12_PUBLIC_KEYS }}" > /tmp/eq12_keys.asc
          gpg --import /tmp/eq12_keys.asc || true
      - name: Show last commit signature
        run: |
          git --no-pager log --show-signature -1 || true
      - name: Upload git signature output
        run: git --no-pager log --show-signature -1 > signature.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: commit-signature
          path: signature.txt

  nightly-dashboard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install requirements & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          python -m playwright install --with-deps || true
      - name: Run dashboard snapshot
        run: |
          mkdir -p logs || true
          python scripts/omni_run.py --dry-run --out logs/dashboard_snapshot.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-snapshot-and-logs
          path: |
            logs/dashboard_snapshot.json
            logs

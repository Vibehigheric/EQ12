name: EQ12 Nightly Sports Betting Evaluation

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.12"
  EQ12_LOGS_DIR: ${{ github.workspace }}/logs

jobs:
  nightly-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout EQ12 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install minimal evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: 📊 Run nightly evaluation wrapper
        run: |
          python scripts/eq12_nightly_evaluation_runner.py --mode daily

      - name: 📤 Upload nightly evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evaluation-${{ github.run_number }}
          path: |
            logs/nightly_evaluation_summary_*.json
            logs/nightly_evaluation_summary_*.md
            logs/nightly_evaluation_runner_*.log
            logs/performance_monitor_*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📝 Publish nightly summary
        if: always()
        shell: bash
        run: |
          latest_summary=$(ls -1t logs/nightly_evaluation_summary_*.md 2>/dev/null | head -n 1 || true)
          {
            echo "## Nightly evaluation"
            echo "- Status: ${{ job.status }}"
            if [ -n "$latest_summary" ]; then
              cat "$latest_summary"
            else
              echo "- No nightly summary generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-deep-analysis:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install minimal evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: 📊 Run weekly evaluation wrapper
        run: |
          python scripts/eq12_nightly_evaluation_runner.py --mode weekly

      - name: 📤 Upload weekly evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-analysis-${{ github.run_number }}
          path: |
            logs/nightly_evaluation_summary_*.json
            logs/nightly_evaluation_summary_*.md
            logs/nightly_evaluation_runner_*.log
            logs/performance_monitor_*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: 📝 Publish weekly summary
        if: always()
        shell: bash
        run: |
          latest_summary=$(ls -1t logs/nightly_evaluation_summary_*.md 2>/dev/null | head -n 1 || true)
          {
            echo "## Weekly analysis"
            echo "- Status: ${{ job.status }}"
            if [ -n "$latest_summary" ]; then
              cat "$latest_summary"
            else
              echo "- No weekly summary generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  alert-on-failure:
    runs-on: ubuntu-latest
    needs: [nightly-evaluation]
    if: failure()

    steps:
      - name: 🚨 Send failure alert when Telegram secrets exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets missing; skipping external failure notification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": \"EQ12 Nightly Evaluation failed. Workflow: ${GITHUB_WORKFLOW} Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",
              \"parse_mode\": \"Markdown\"
            }"

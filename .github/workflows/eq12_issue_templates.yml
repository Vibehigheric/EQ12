name: EQ12 Issue Templates and Automation

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  issue-automation:
    name: Issue automation
    runs-on: ubuntu-latest
    steps:
      - name: Label and comment on issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";
            const labels = new Set();

            if (title.includes("[BUG]") || body.includes("bug_report")) {
              ["bug", "needs-investigation", "eq12-system"].forEach((label) => labels.add(label));
            }

            if (title.includes("[FEATURE]") || body.includes("feature_request")) {
              ["enhancement", "feature-request", "eq12-system"].forEach((label) => labels.add(label));
            }

            if (title.includes("[IMPROVEMENT]") || body.includes("improvement")) {
              ["improvement", "enhancement", "eq12-system"].forEach((label) => labels.add(label));
            }

            if (/Pylance|EPIPE|ASCII/i.test(body)) {
              ["priority-high", "pylance-stability"].forEach((label) => labels.add(label));
            }

            if (/pycache|Unicode corruption/i.test(body)) {
              ["priority-critical", "corruption-immunity"].forEach((label) => labels.add(label));
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: Array.from(labels),
              });
            }

            if (context.payload.action === "opened" && body.includes("system status")) {
              const comment = [
                "## EQ12 System Health Check",
                "",
                "Run these diagnostics:",
                "- `python scripts/eq12_system_status.py --verbose`",
                "- `python scripts/eq12_ascii_validator.py`",
                "- `Get-ExecutionPolicy`",
              ].join("\n");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment,
              });
            }

            if (context.payload.action === "opened" && (title.length < 10 || body.length < 50)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["invalid", "needs-more-info"],
              });
            }

      - name: Summarize issue automation
        if: always()
        run: |
          {
            echo "## Issue automation"
            echo "- Event: ${{ github.event_name }}"
            echo "- Action: ${{ github.event.action }}"
            echo "- Issue: ${{ github.event.issue.number || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"

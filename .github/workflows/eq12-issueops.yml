name: EQ12 IssueOps
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  parse:
    if: contains(github.event.comment.body, '/eq12')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim()
            const user = context.payload.comment.user.login
            const repo = context.repo
            const allowed = ['MEMBER','OWNER','COLLABORATOR'].includes(context.payload.comment.author_association)
            if (!allowed) {
              core.setFailed(`User @${user} not allowed to run IssueOps`)
              return
            }
            const cmd = body.split(/\s+/)
            if (cmd[0] === '/eq12') {
              if (cmd[1] === 'secrets:check') {
                core.summary.addHeading('EQ12 Secrets Check').addRaw('Dispatching...').write()
                await github.rest.repos.createDispatchEvent({
                  owner: repo.owner, repo: repo.repo,
                  event_type: 'eq12-secrets-check'
                })
              } else if (cmd[1] === 'nightly:dryrun') {
                await github.rest.repos.createDispatchEvent({
                  owner: repo.owner, repo: repo.repo,
                  event_type: 'eq12-nightly-dryrun'
                })
              } else if (cmd[1] === 'gpg:verify') {
                await github.rest.repos.createDispatchEvent({
                  owner: repo.owner, repo: repo.repo,
                  event_type: 'eq12-gpg-verify'
                })
              } else {
                core.setFailed(`Unknown /eq12 command: ${cmd.slice(1).join(' ')}`)
              }
            }

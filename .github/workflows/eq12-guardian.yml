name: EQ12 Guardian CI
on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      pycache: ${{ steps.cache-python.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  gpg-verify:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/eq12-gpg-verify

  secrets:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/eq12-secrets-check
        with:
          required: "ODDS_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  python-tests:
    runs-on: ubuntu-latest
    needs: [setup, secrets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pytest
        run: |
          if [ -d tests ]; then pytest -q || (echo "::warning::pytest failed"; exit 1); else echo "No tests dir"; fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq12-logs
          path: |
            C:\\EQ12\\logs
            /home/runner/work/**/logs
          if-no-files-found: ignore

  powershell-tests:
    runs-on: windows-latest
    needs: [setup, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser
      - name: Run Pester
        shell: pwsh
        run: |
          if (Test-Path .\tests\pester) { Invoke-Pester -Path .\tests\pester -Output Detailed } else { Write-Host "No Pester tests"; }

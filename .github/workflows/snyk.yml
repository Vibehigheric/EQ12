name: Snyk Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  snyk:
    name: Snyk Open Source Scan
    if: ${{ secrets.ACTIONS_BUDGET_LOCK != '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_ORG: 2563a942-79c3-4241-a0db-659ec1520291
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for dependency resolution)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project deps if present
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v4

      - name: Run Snyk test (all projects)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects --severity-threshold=medium --org="$SNYK_ORG" --sarif-file-output=snyk.sarif || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

name: Snyk Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    name: Snyk Open Source Scan
    runs-on: ubuntu-latest
    env:
      SNYK_ORG: 2563a942-79c3-4241-a0db-659ec1520291
    steps:
      - uses: actions/checkout@v4

      - name: Gate by budget and token availability
        id: gate
        shell: bash
        run: |
          if [ "${{ secrets.ACTIONS_BUDGET_LOCK }}" = "1" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_scan=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project deps if present
        if: steps.gate.outputs.run_scan == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Set up Snyk CLI
        if: steps.gate.outputs.run_scan == 'true'
        uses: snyk/actions/setup@v4

      - name: Run Snyk test
        if: steps.gate.outputs.run_scan == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects --severity-threshold=medium --org="$SNYK_ORG" --sarif-file-output=snyk.sarif || true

      - name: Upload SARIF results
        if: steps.gate.outputs.run_scan == 'true' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Snyk scan"
            echo "- Executed: ${{ steps.gate.outputs.run_scan || 'false' }}"
            echo "- SARIF: snyk.sarif"
          } >> "$GITHUB_STEP_SUMMARY"

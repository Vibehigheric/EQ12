name: EQ12 Daily CI

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run pytest
        run: pytest -q || true

      - name: Start ngrok if token present
        if: secrets.NGROK_AUTHTOKEN != ''
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          curl -sSLo ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip -q ngrok.zip -d ./
          chmod +x ./ngrok
          ./ngrok authtoken "$NGROK_AUTHTOKEN"
          nohup ./ngrok http 8080 --log=stdout --log-format=logfmt > ngrok.log 2>&1 &
          sleep 5
          curl -sS http://127.0.0.1:4040/api/tunnels > ngrok_api.json || true
          jq -r '.tunnels[] | {name: .name, url: .public_url}' ngrok_api.json > ngrok_urls.json || true

      - name: Verify last commit signature
        run: |
          git --no-pager log -1 --show-signature || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eq12-artifacts
          path: |
            ngrok.log
            ngrok_urls.json
            pester-results.xml
            logs/**

  windows-pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Script C:\EQ12\tests\pester -OutputFormat NUnitXml -OutputFile pester-results.xml

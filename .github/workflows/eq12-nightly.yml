name: EQ12 Nightly
on:
  schedule:
    - cron: '15 3 * * *'  # 03:15 UTC nightly
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run eq12 dry-run
        run: |
          if [ -f scripts/eq12_nightly.py ]; then python scripts/eq12_nightly.py --dry-run; fi
      - name: Upload artifacts (logs & dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: eq12-nightly-artifacts
          path: |
            **/logs/**/*.json
            **/dashboard/**/*.html
          if-no-files-found: ignore
      - name: Telegram alert on failure
        if: failure()
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            msg="⚠️ EQ12 Nightly failed in $GITHUB_REPOSITORY @ $GITHUB_SHA"
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${msg}" > /dev/null
          fi

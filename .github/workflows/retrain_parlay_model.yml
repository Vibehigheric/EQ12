name: EQ12 Nightly Parlay Model Retraining

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: Force retraining even if performance is good
        required: false
        default: 'false'
      min_new_samples:
        description: Minimum new samples required for retraining
        required: false
        default: '10'

env:
  PYTHON_VERSION: '3.12'
  MODEL_PERFORMANCE_THRESHOLD: 0.60
  MIN_TRAINING_SAMPLES: 50

jobs:
  check-new-data:
    runs-on: ubuntu-latest
    outputs:
      should_retrain: ${{ steps.check.outputs.should_retrain }}
      new_samples: ${{ steps.check.outputs.new_samples }}
      last_model_date: ${{ steps.check.outputs.last_model_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn>=1.3.0

      - name: Check for new parlay data
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          import os

          logs_dir = Path("logs")
          parlay_files = list(logs_dir.glob("parlay_analysis_*.json")) if logs_dir.exists() else []
          feedback_files = list(logs_dir.glob("parlay_feedback.jsonl")) if logs_dir.exists() else []

          models_dir = Path("eq12_learn")
          model_files = list(models_dir.glob("parlay_ensemble_model_*.pkl")) if models_dir.exists() else []

          if model_files:
            latest_model = max(model_files, key=lambda path: path.stat().st_mtime)
            last_model_time = datetime.fromtimestamp(latest_model.stat().st_mtime)
          else:
            last_model_time = datetime(2020, 1, 1)

          new_samples = 0
          cutoff_time = last_model_time - timedelta(days=1)
          for file_path in parlay_files:
            if datetime.fromtimestamp(file_path.stat().st_mtime) > cutoff_time:
              try:
                with open(file_path, "r", encoding="utf-8") as handle:
                  new_samples += len(json.load(handle).get("parlays", []))
              except Exception as exc:
                print(f"Error reading {file_path}: {exc}")

          new_feedback = 0
          for file_path in feedback_files:
            if datetime.fromtimestamp(file_path.stat().st_mtime) > cutoff_time:
              try:
                with open(file_path, "r", encoding="utf-8") as handle:
                  new_feedback += len(handle.readlines())
              except Exception as exc:
                print(f"Error reading {file_path}: {exc}")

          min_samples = int("${{ github.event.inputs.min_new_samples || '10' }}")
          force_retrain = "${{ github.event.inputs.force_retrain }}" == "true"
          should_retrain = force_retrain or new_samples >= min_samples or new_feedback >= 5 or len(model_files) == 0

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
            handle.write(f"should_retrain={str(should_retrain).lower()}\n")
            handle.write(f"new_samples={new_samples + new_feedback}\n")
            handle.write(f"last_model_date={last_model_time.isoformat()}\n")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## EQ12 Retrain Gate"
            echo
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Should retrain: \`${{ steps.check.outputs.should_retrain }}\`"
            echo "- New samples: \`${{ steps.check.outputs.new_samples }}\`"
            echo "- Last model date: \`${{ steps.check.outputs.last_model_date }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  retrain-model:
    needs: check-new-data
    if: needs.check-new-data.outputs.should_retrain == 'true'
    runs-on: ubuntu-latest
    outputs:
      model_accuracy: ${{ steps.train_model.outputs.model_accuracy }}
      model_file: ${{ steps.train_model.outputs.model_file }}
      training_success: ${{ steps.train_model.outputs.training_success }}
      dataset_created: ${{ steps.build_dataset.outputs.dataset_created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn>=1.3.0 xgboost>=1.7.0 joblib
          pip install fastapi uvicorn pydantic

      - name: Create directories
        run: mkdir -p logs eq12_learn

      - name: Build parlay dataset
        id: build_dataset
        shell: bash
        run: |
          cd eq12_learn
          python build_parlay_dataset.py --logs-dir ../logs --output-dir . --verbose

          if ls parlay_dataset*.pkl 1> /dev/null 2>&1; then
            DATASET_FILE=$(ls parlay_dataset*.pkl | head -1)
            echo "dataset_file=$DATASET_FILE" >> "$GITHUB_OUTPUT"
            echo "dataset_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "dataset_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Train ML model
        if: steps.build_dataset.outputs.dataset_created == 'true'
        id: train_model
        shell: bash
        run: |
          cd eq12_learn
          DATASET_FILE="${{ steps.build_dataset.outputs.dataset_file }}"
          python train_parlay_model.py --dataset "$DATASET_FILE" --output-dir . --verbose

          if ls parlay_ensemble_model_*.pkl 1> /dev/null 2>&1; then
            MODEL_FILE=$(ls parlay_ensemble_model_*.pkl | head -1)
            REPORT_FILE="${MODEL_FILE%.*}_report.json"
            echo "model_file=$MODEL_FILE" >> "$GITHUB_OUTPUT"

            if [ -f "$REPORT_FILE" ]; then
              ACCURACY=$(python - <<PY
          import json
          with open("$REPORT_FILE", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          print(data.get("ensemble", {}).get("ensemble_roc_auc", 0.0))
          PY
              )
              echo "model_accuracy=$ACCURACY" >> "$GITHUB_OUTPUT"
              echo "training_success=true" >> "$GITHUB_OUTPUT"
            else
              echo "training_success=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "training_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate model performance
        if: steps.train_model.outputs.training_success == 'true'
        id: validate_model
        shell: bash
        run: |
          MODEL_ACCURACY="${{ steps.train_model.outputs.model_accuracy }}"
          THRESHOLD="${{ env.MODEL_PERFORMANCE_THRESHOLD }}"

          if python -c "import sys; sys.exit(0 if float('$MODEL_ACCURACY') >= float('$THRESHOLD') else 1)"; then
            echo "deploy_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_model=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy model
        if: steps.validate_model.outputs.deploy_model == 'true'
        shell: bash
        run: |
          MODEL_FILE="${{ steps.train_model.outputs.model_file }}"
          cp "eq12_learn/$MODEL_FILE" "eq12_learn/parlay_ensemble_model.pkl"

          cat > eq12_learn/deployment_manifest.json << EOF
          {
            "deployment_timestamp": "$(date -Iseconds)",
            "model_file": "$MODEL_FILE",
            "model_accuracy": ${{ steps.train_model.outputs.model_accuracy }},
            "new_samples": ${{ needs.check-new-data.outputs.new_samples }},
            "last_model_date": "${{ needs.check-new-data.outputs.last_model_date }}",
            "github_run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

      - name: Run model tests
        if: steps.validate_model.outputs.deploy_model == 'true'
        shell: bash
        run: |
          cd eq12_learn
          python - <<'PY'
          import sys
          sys.path.append('.')
          from train_parlay_model import load_trained_model
          model = load_trained_model('parlay_ensemble_model.pkl')
          print('Model loads successfully')
          PY

      - name: Commit and push model
        if: steps.validate_model.outputs.deploy_model == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add eq12_learn/parlay_ensemble_model.pkl eq12_learn/deployment_manifest.json
          git commit -m "chore: auto-deploy parlay model ROC-AUC ${{ steps.train_model.outputs.model_accuracy }}" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload retraining artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parlay-retraining-artifacts
          path: |
            logs/
            eq12_learn/parlay_dataset*.*
            eq12_learn/parlay_ensemble_model*.*
            eq12_learn/*report.json
            eq12_learn/deployment_manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## EQ12 Nightly Parlay Retraining"
            echo
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Dataset created: \`${{ steps.build_dataset.outputs.dataset_created }}\`"
            echo "- Training success: \`${{ steps.train_model.outputs.training_success }}\`"
            echo "- Model accuracy: \`${{ steps.train_model.outputs.model_accuracy }}\`"
            echo "- Model file: \`${{ steps.train_model.outputs.model_file }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  send-notification:
    needs: [check-new-data, retrain-model]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          if [ "${{ needs.retrain-model.result }}" = "success" ]; then
            STATUS="SUCCESS"
            MESSAGE="EQ12 parlay model retrained successfully. ROC-AUC: ${{ needs.retrain-model.outputs.model_accuracy }}."
          elif [ "${{ needs.check-new-data.outputs.should_retrain }}" = "false" ]; then
            STATUS="SKIPPED"
            MESSAGE="EQ12 model retraining skipped because not enough new data was found."
          else
            STATUS="FAILED"
            MESSAGE="EQ12 model retraining failed. Review the workflow logs."
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$STATUS: $MESSAGE Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## EQ12 Retraining Notification"
            echo
            echo "- Check-new-data result: \`${{ needs.check-new-data.result }}\`"
            echo "- Retrain-model result: \`${{ needs.retrain-model.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

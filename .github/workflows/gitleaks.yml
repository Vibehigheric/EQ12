name: Gitleaks Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks
        id: scan
        continue-on-error: true
        run: |
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --report-format sarif --report-path results.sarif

      - name: Filter known false positives
        id: filter
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("results.sarif")
          if not report_path.exists():
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("remaining_findings=scan_error\n")
                  handle.write("filtered_findings=0\n")
              raise SystemExit(0)

          data = json.loads(report_path.read_text(encoding="utf-8"))
          results = data.get("runs", [{}])[0].get("results", [])
          filtered = []
          removed = []
          for item in results:
              location = (((item.get("locations") or [{}])[0]).get("physicalLocation") or {})
              artifact = (location.get("artifactLocation") or {}).get("uri", "")
              rule_id = item.get("ruleId", "")
              if Path(artifact).name == "README.md" and rule_id in {"sidekiq-secret", "generic-api-key"}:
                  removed.append({"rule": rule_id, "file": artifact})
                  continue
              filtered.append(item)

          data.setdefault("runs", [{}])[0]["results"] = filtered
          report_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"remaining_findings={len(filtered)}\n")
              handle.write(f"filtered_findings={len(removed)}\n")
          PY

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Gitleaks Security Scan"
            echo
            echo "- Step outcome: \`${{ steps.scan.outcome }}\`"
            echo "- Filtered README false positives: \`${{ steps.filter.outputs.filtered_findings || '0' }}\`"
            echo "- Remaining findings: \`${{ steps.filter.outputs.remaining_findings || '0' }}\`"
            echo "- Config path: \`.gitleaks.toml\`"
            echo "- Report path: \`results.sarif\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR if secrets found
        if: steps.filter.outputs.remaining_findings != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Gitleaks detected potential secrets.** Review the SARIF artifact and remove confirmed credentials before merging.'
            })

      - name: Fail job when confirmed findings remain
        if: steps.filter.outputs.remaining_findings != '0'
        run: |
          echo "Gitleaks reported confirmed findings."
          exit 1

name: 🔐 EQ12 Security Scanning & Compliance

on:
  push:
    branches: ["master", "main", "release/*"]
  pull_request:
    branches: ["master", "main", "release/*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  codeql-analysis:
    name: 🔍 CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐍 Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: 🏗️ Build for CodeQL (Python)
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "requirements.txt install failed; continuing for CodeQL."
          fi

      - name: 🏗️ Build for CodeQL (JavaScript)
        if: matrix.language == 'javascript'
        run: |
          if [ -f package-lock.json ]; then
            npm ci || echo "npm ci failed; continuing for CodeQL."
          elif [ -f package.json ]; then
            npm install --ignore-scripts || echo "npm install failed; continuing for CodeQL."
          else
            echo "No JavaScript package manifest found; skipping npm install."
          fi

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## CodeQL ${{ matrix.language }}"
            echo "- Status: ${{ job.status }}"
            echo "- Output: GitHub code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: 🛡️ Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🛡️ Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Dependency review"
            echo "- Status: ${{ job.status }}"
            echo "- Output: pull request dependency review annotations"
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks-scan:
    name: 🔐 Advanced Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: 🔎 Run gitleaks scan
        id: gitleaks_scan
        continue-on-error: true
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --no-banner

      - name: 🧹 Filter known gitleaks false positives
        id: gitleaks_filter
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("gitleaks-report.json")
          if not report_path.exists():
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("remaining_findings=scan_error\n")
                  handle.write("filtered_findings=0\n")
              raise SystemExit(0)

          data = json.loads(report_path.read_text(encoding="utf-8"))
          filtered = []
          removed = []
          for item in data:
              file_name = Path(item.get("File", "")).name
              rule_id = item.get("RuleID", "")
              if file_name == "README.md" and rule_id in {"sidekiq-secret", "generic-api-key"}:
                  removed.append({"rule": rule_id, "file": item.get("File", "")})
                  continue
              filtered.append(item)

          report_path.write_text(json.dumps(filtered, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"remaining_findings={len(filtered)}\n")
              handle.write(f"filtered_findings={len(removed)}\n")
          PY

      - name: ❌ Fail on confirmed gitleaks findings
        if: steps.gitleaks_filter.outputs.remaining_findings != '0'
        run: |
          echo "Confirmed gitleaks findings remain: ${{ steps.gitleaks_filter.outputs.remaining_findings }}"
          exit 1

      - name: 📤 Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Gitleaks"
            echo "- Status: ${{ job.status }}"
            echo "- Config: .gitleaks.toml"
            echo "- Output: gitleaks-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

  python-security:
    name: 🐍 Python Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit safety
          pip install semgrep==1.165.0 || echo "semgrep install failed; continuing with bandit, pip-audit, and safety."
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "requirements.txt install failed; continuing with base tooling."
          fi

      - name: 🔍 Run Python security tooling
        run: |
          bandit -r . -f json -o bandit-report.json || true
          pip-audit --format json --output pip-audit-report.json || true
          safety check --json --output safety-report.json || true
          if command -v semgrep >/dev/null 2>&1; then
            semgrep --config=auto --json --output=semgrep-report.json . || true
          else
            printf '[]\n' > semgrep-report.json
          fi

      - name: 📤 Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            safety-report.json
            semgrep-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Python security"
            echo "- Status: ${{ job.status }}"
            echo "- Outputs: bandit-report.json, pip-audit-report.json, safety-report.json, semgrep-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

  container-security:
    name: 🐳 Container & Infrastructure Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: 📤 Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: 🏗️ Run Checkov scan
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov
          checkov -d . --framework all --output json > checkov-report.json || true

      - name: 📤 Upload infrastructure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-security-reports
          path: |
            trivy-results.sarif
            checkov-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Container and infrastructure security"
            echo "- Status: ${{ job.status }}"
            echo "- Outputs: trivy-results.sarif, checkov-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

  supply-chain-security:
    name: 🔗 Supply Chain Security & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install SBOM tooling
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom pip-tools
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.18.1/syft_1.18.1_linux_amd64.tar.gz -o syft.tar.gz
          tar -xzf syft.tar.gz syft
          sudo install syft /usr/local/bin/syft

      - name: 🔒 Generate hashed lockfile when possible
        run: |
          if [ -f pyproject.toml ]; then
            pip-compile --generate-hashes --resolver=backtracking pyproject.toml || echo "pip-compile from pyproject.toml failed."
          elif [ -f requirements.in ]; then
            pip-compile --generate-hashes --resolver=backtracking requirements.in || echo "pip-compile from requirements.in failed."
          else
            echo "No pyproject.toml or requirements.in found; skipping lockfile generation."
          fi

      - name: 📋 Generate SBOMs
        run: |
          cyclonedx-py environment -o sbom-cyclonedx.json || echo "{}" > sbom-cyclonedx.json
          syft . -o json=sbom-syft.json
          syft . -o spdx-json=sbom-spdx.json

      - name: 📤 Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-*.json
            requirements.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Supply chain security"
            echo "- Status: ${{ job.status }}"
            echo "- Outputs: sbom-cyclonedx.json, sbom-syft.json, sbom-spdx.json"
          } >> "$GITHUB_STEP_SUMMARY"

  license-compliance:
    name: ⚖️ License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📜 Install license tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "requirements.txt install failed; generating license report from installed environment only."
          fi

      - name: 🔍 Check package licenses
        run: |
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --format=csv --output-file=python-licenses.csv

      - name: 📤 Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            python-licenses.json
            python-licenses.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## License compliance"
            echo "- Status: ${{ job.status }}"
            echo "- Outputs: python-licenses.json, python-licenses.csv"
          } >> "$GITHUB_STEP_SUMMARY"

  security-summary:
    name: 📊 Security Summary Report
    runs-on: ubuntu-latest
    needs:
      - codeql-analysis
      - gitleaks-scan
      - python-security
      - container-security
      - supply-chain-security
      - license-compliance
    if: always()

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security-reports

      - name: 📊 Generate summary
        run: |
          cat > security-summary.md <<EOF
          # EQ12 Security Summary

          - CodeQL: ${{ needs.codeql-analysis.result }}
          - Gitleaks: ${{ needs.gitleaks-scan.result }}
          - Python security: ${{ needs.python-security.result }}
          - Container security: ${{ needs.container-security.result }}
          - Supply chain security: ${{ needs.supply-chain-security.result }}
          - License compliance: ${{ needs.license-compliance.result }}

          Artifacts path: security-reports/
          Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

  security-alert-response:
    name: 🚨 Security Alert Response
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[security-urgent]'))
    timeout-minutes: 10

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🚨 Run urgent dependency check
        run: |
          python -m pip install --upgrade pip
          pip install safety
          safety check --json > safety-critical-report.json || true

      - name: 📤 Upload urgent scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-alert-response
          path: safety-critical-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Security alert response"
            echo "- Status: ${{ job.status }}"
            echo "- Output: safety-critical-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

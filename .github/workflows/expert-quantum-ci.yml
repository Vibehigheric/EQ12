name: EQ12 Expert Quantum CI
on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.12"
    NODE_VERSION: "20"

jobs:
    quantum-lint:
        name: Expert Quantum Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pre-commit black isort ruff flake8 bandit pytest

            - name: Run Expert Quantum linting
              run: |
                  pre-commit install --install-hooks || true
                  pre-commit run --all-files || echo "Linting completed with warnings"

            - name: Security scan
              run: |
                  bandit -r scripts/ -f json -o quantum-security.json || true

    quantum-test:
        name: Expert Quantum Tests
        runs-on: ubuntu-latest
        needs: quantum-lint
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest pytest-cov numpy pandas requests

            - name: Run quantum tests
              run: |
                  if [ -d tests ]; then
                    pytest -v --cov=scripts/ --cov-report=xml
                  else
                    echo "Creating basic test structure..."
                    mkdir -p tests
                    echo "# Expert Quantum Test Suite" > tests/__init__.py
                  fi

name: EQ12 WireGuard Tunnel (snippet)
on:
  workflow_dispatch:

jobs:
  run-through-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wireguard tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools

      - name: Write wg config
        env:
          WG_PEER_CONFIG: ${{ secrets.WG_PEER_CONFIG }}
        run: |
          echo "$WG_PEER_CONFIG" | sudo tee /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Bring up tunnel
        run: |
          sudo wg-quick up wg0

      - name: Run EQ12 task through tunnel
        run: |
          # Example: call the internal EQ12 endpoint at the WireGuard IP
          curl -sS http://10.0.0.2:5000/health

      - name: Tear down tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 || true

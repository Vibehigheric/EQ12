<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-weight: bold;
      color: #2196F3;
      font-size: 18px;
    }
    
    .status {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }
    
    .status-dot.active {
      background: #28a745;
    }
    
    .status-dot.inactive {
      background: #dc3545;
    }
    
    .controls {
      margin: 20px 0;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-warning {
      background: #ffc107;
      color: black;
    }
    
    .mode-selector {
      margin: 15px 0;
    }
    
    .mode-selector select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">EQ12 Governance</div>
    <div>Cross-Browser Extension</div>
  </div>
  
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <div id="statusText">Loading...</div>
  </div>
  
  <div class="mode-selector">
    <label for="modeSelect">Governance Mode:</label>
    <select id="modeSelect">
      <option value="standard">Standard</option>
      <option value="strict">Strict Compliance</option>
      <option value="enterprise">Enterprise</option>
      <option value="privacy">Privacy Focused</option>
    </select>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" id="toggleBtn">Enable Governance</button>
    <button class="btn btn-success" id="analyzeBtn">Analyze Current Page</button>
    <button class="btn btn-warning" id="reportBtn">Generate Report</button>
  </div>
  
  <div id="lastAnalysis" style="display: none;">
    <h4>Last Analysis:</h4>
    <div id="analysisResults"></div>
  </div>
  
  <div class="footer">
    <div>EQ12 Stack v1.0</div>
    <div>Cross-Browser Compatible</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>

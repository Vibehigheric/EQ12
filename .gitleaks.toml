title = "EQ12 gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow placeholder secrets and example fixtures"
regexTarget = "match"
paths = [
  '''(?:^|/)(?:docs|examples|tests)(?:/.*)?$''',
  '''(?:^|/)tests/fixtures(?:/.*)?$''',
  '''(?:^|/)\.env\.(?:template|example)$''',
  '''(?:^|/)(?:test_.*|.*_test)\.py$''',
  '''(?:^|/)gitleaks\.toml$''',
  '''(?:^|/)(?:profiles|bin|obj|__pycache__|\.tmp)(?:/.*)?$''',
  '''(?:^|/)(?:vendor|xampp-source|data/odds_cache|incident_response)(?:/.*)?$''',
  '''(?:^|/)enterprise/k8s-manifests\.yml$''',
  '''(?:^|/)scripts/agentic_secret_detection\.py$''',
  '''(?:^|/).*\.backup_[0-9_]+$''',
  '''(?:^|/).*\.bak(?:\..*)?$''',
  '''(?:^|/)gitleaks-report(?:-working-tree)?\.json$'''
]
regexes = [
  '''(?i)(?:PLACEHOLDER|EXAMPLE|SAMPLE|YOUR_[A-Z_]+|REPLACE_[A-Z_]+|REPLACE_ME|DUMMY|FAKE|MOCK|TEST_(?:KEY|TOKEN|SECRET)|example_password)''',
  '''(?i)github_pat_\*+''',
  '''(?i)ghp_\*+''',
  '''\b[a-f0-9]{40}\b''',
  '''eq12-test-key-2025''',
  '''(?i)gsk_[A-Za-z0-9]+\.\.\.''',
  '''(?i)sk-or-v1-[A-Za-z0-9.-]+\.\.\.''',
  '''(?i)password["']?\s*[:=]\s*["']password["']''',
  '''self\.eq12_root''',
  '''Minute/hourly/daily''',
  '''ghp_1234567890123456789012345678901234567890''',
  '''sk-1234567890abcdef1234567890abcdef123456789012345678'''
]
stopwords = [
  "placeholder",
  "example",
  "sample",
  "dummy",
  "fake",
  "mock"
]

[[rules]]
id = "eq12-generic-api-key"
description = "Generic API key assigned in code or config"
regex = '''(?i)(?:api[_-]?key|apikey|access[_-]?token)[\"']*\s*[:=]\s*[\"']?([a-zA-Z0-9]{20,})'''
keywords = ["api", "key", "token", "secret"]

[[rules]]
id = "eq12-slack-token"
description = "Slack token"
regex = '''xox[baprs]-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}'''
keywords = ["slack"]

[[rules]]
id = "eq12-github-token"
description = "GitHub token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,}'''
keywords = ["github"]

[[rules]]
id = "eq12-openai-api-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
keywords = ["openai", "sk-"]

[[rules]]
id = "eq12-telegram-bot-token"
description = "Telegram bot token"
regex = '''[0-9]{8,10}:[A-Za-z0-9_-]{35}'''
keywords = ["telegram", "bot"]

[[rules]]
id = "eq12-aws-secret-access-key"
description = "AWS secret access key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key[\"']*\s*[:=]\s*[\"']?([A-Za-z0-9/\+=]{40})'''
keywords = ["aws", "secret", "access"]

[[rules]]
id = "eq12-private-key"
description = "Private key"
regex = '''-----BEGIN [A-Z ]+ PRIVATE KEY-----'''
keywords = ["private", "key", "begin"]

[[rules]]
id = "eq12-password"
description = "Password assigned in config"
regex = '''(?i)password[\"']*\s*[:=]\s*[\"']([^\"'\\n]{8,})[\"']'''
keywords = ["password"]

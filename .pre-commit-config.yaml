#
# Pre-commit configuration for EQ12 - Comprehensive Security & Quality Gates
# =========================================================================

repos:
  # 🔐 Security Scanning Hooks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        name: 🔒 GitLeaks Secret Scanner
        description: Comprehensive secret scanning with custom rules
        args: ['--config=.gitleaks.toml', '--verbose']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: 🔍 Detect Secrets
        description: Scan for API keys, passwords, and other secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: 🚨 Security Vulnerability Scan
        description: Find common security issues in Python code
        args: ['-r', '.', '-f', 'json', '-o', 'bandit-report.json']
        exclude: 'tests/'

  # 🐍 Python Code Quality Hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ⚡ Fast Python Linting
        args: [--fix]
      - id: ruff-format
        name: 🎨 Fast Code Formatting

  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        name: 🎨 Code Formatting (Black)
        description: Automatic Python code formatting
        language_version: python3
        args: ['--line-length=88']

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: 📦 Import Sorting
        description: Sort Python imports consistently
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: 🔍 Static Type Checking
        description: Check Python type hints
        additional_dependencies: ["types-requests", "types-pytz", "types-PyYAML"]
        args: ['--ignore-missing-imports', '--strict-optional']

  # 📝 General Code Quality Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: ✂️ Remove Trailing Whitespace

      - id: end-of-file-fixer
        name: 📄 Fix End of File

      - id: check-yaml
        name: ✅ YAML Syntax Check

      - id: check-json
        name: ✅ JSON Syntax Check

      - id: check-toml
        name: ✅ TOML Syntax Check

      - id: check-merge-conflict
        name: ⚠️ Check for Merge Conflicts

      - id: check-case-conflict
        name: 📁 Check Filename Case Conflicts

      - id: detect-private-key
        name: 🔐 Detect Private Keys

      - id: check-executables-have-shebangs
        name: 🔧 Check Executable Shebangs

      - id: mixed-line-ending
        name: 📏 Fix Mixed Line Endings
        args: ['--fix=lf']

      - id: check-added-large-files
        name: 📦 Check for Large Files
        args: ['--maxkb=1024']

  # 🔒 Dependency Security Hooks
  - repo: https://github.com/PyCQA/safety
    rev: 2.3.5
    hooks:
      - id: safety
        name: 🔐 Python Dependency Vulnerability Scan
        description: Check Python dependencies for known vulnerabilities
        args: ['--json', '--output', 'safety-report.json']

  # 📊 Additional Python Quality Tools
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: 📚 Docstring Style Check
        description: Check Python docstring style
        args: ['--convention=google']

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        name: ⬆️ Upgrade Python Syntax
        description: Automatically upgrade Python syntax
        args: [--py38-plus]

  # 🎯 EQ12 Custom Security & Compliance Hooks
  - repo: local
    hooks:
      - id: eq12-sportsbook-validation
        name: 🎯 EQ12 Sportsbook Policy Validation
        entry: python scripts/run_evals.py --sportsbook-check
        language: system
        types: [python]
        pass_filenames: false

      - id: eq12-datetime-validation
        name: ⏰ EQ12 UTC Datetime Validation
        entry: bash -c 'if grep -r "datetime\.now()" --include="*.py" . | grep -v "timezone\|utc"; then echo "❌ Found naive datetime.now() - use eq12_timezone.utc_now()"; exit 1; fi'
        language: system
        types: [python]
        pass_filenames: false

      - id: eq12-secrets-check
        name: 🔐 EQ12 Enhanced Secrets Detection
        entry: bash -c 'if grep -r -E "(api_key|token|secret|password)\s*=\s*['\''\"'][^'\''\""]{10,}" --include="*.py" .; then echo "❌ Potential hardcoded secrets detected"; exit 1; fi'
        language: system
        types: [python]
        pass_filenames: false

      - id: validate-betting-data
        name: 🎯 Validate Betting Data Integrity
        description: Ensure betting data integrity and format
        entry: python -c "
import json, sys, os
for root, dirs, files in os.walk('data'):
    for file in files:
        if file.endswith('.json'):
            try:
                with open(os.path.join(root, file)) as f:
                    json.load(f)
            except:
                print(f'❌ Invalid JSON: {file}')
                sys.exit(1)
print('✅ All betting data files valid')
"
        language: system
        files: '^data/.*\.(json|csv)$'

      - id: check-gambling-compliance
        name: ⚖️ Gambling Compliance Check
        description: Ensure compliance with gambling regulations
        entry: bash -c 'if grep -r -i "guaranteed.*win\|sure.*bet\|risk.*free" --include="*.py" --include="*.md" . | grep -v "compliance\|test\|example"; then echo "❌ Potential gambling compliance violation detected"; exit 1; fi'
        language: system
        files: '^.*\.(py|md|txt)$'

      - id: lint-powershell
        name: 🔧 PowerShell Script Linting
        description: Lint PowerShell scripts for best practices
        entry: bash -c 'for file in *.ps1; do [ -f "$file" ] && echo "Checking $file" || continue; done'
        language: system
        files: '\.ps1$'

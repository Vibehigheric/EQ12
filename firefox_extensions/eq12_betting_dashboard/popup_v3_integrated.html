<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>EQ12 Betting Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            font-family: ui-sans-serif, system-ui, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-width: 380px;
        }

        .wrap {
            width: 100%;
            max-width: 380px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(16, 185, 129, .1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, .3);
        }

        .header h3 {
            margin: 0;
            color: #10b981;
            font-size: 18px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .row.main-actions {
            justify-content: space-between;
        }

        .row.secondary-actions {
            justify-content: center;
        }

        button {
            padding: 8px 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
            min-width: 80px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, .3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-parlay {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-parlay:hover {
            box-shadow: 0 4px 12px rgba(16, 185, 129, .3);
        }

        .btn-audit {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .btn-audit:hover {
            box-shadow: 0 4px 12px rgba(245, 158, 11, .3);
        }

        .btn-privacy {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            font-size: 12px;
        }

        .btn-privacy:hover {
            box-shadow: 0 4px 12px rgba(139, 92, 246, .3);
        }

        .out {
            background: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow: auto;
            border-radius: 6px;
            border: 1px solid #374151;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .out:empty {
            display: none;
        }

        .out.loading {
            color: #10b981;
            text-align: center;
        }

        .out.error {
            color: #ef4444;
            border-color: #ef4444;
            background: rgba(239, 68, 68, .1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #374151;
            padding-top: 8px;
            margin-top: 8px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #10b981;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
        }

        a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            border-top: 1px solid #374151;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="header">
            <h3>🎯 EQ12 Betting Dashboard</h3>
            <div class="subtitle">Advanced Parlay Generation & Analytics</div>
        </div>

        <div class="row main-actions">
            <button id="btn-5" class="btn-parlay">🎟️ 5-Leg</button>
            <button id="btn-10" class="btn-parlay">🎟️ 10-Leg</button>
            <button id="btn-audit" class="btn-audit">🧾 Audit</button>
        </div>

        <div class="row secondary-actions">
            <button id="btn-privacy" class="btn-privacy">🛡️ Privacy</button>
            <button id="btn-dev-tools" class="btn-privacy">🔧 Dev Tools</button>
            <button id="btn-vpn" class="btn-privacy">🔐 VPN Status</button>
        </div>

        <pre id="out" class="out"></pre>

        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <div id="last-update">Never</div>
        </div>

        <div class="footer-links">
            <a id="open-options" href="#">⚙️ Settings</a>
            <a id="open-dashboard" href="#">📊 Dashboard</a>
            <a id="copy-result" href="#" style="display:none;">📋 Copy</a>
        </div>
    </div>
    <script type="module" src="popup_v3_enhanced.js"></script>
</body>

</html>

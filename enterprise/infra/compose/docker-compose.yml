version: "3.9"

# EQ12 Enterprise Stack - Docker Compose Configuration
# Integrates with existing EQ12 system (312 components) and management toolchain

services:
  # Infrastructure Services
  traefik:
    image: traefik:v3.1
    container_name: eq12_traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@eq12.local}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - eq12-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${EQ12_HOST:-localhost}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"

  # Data Storage
  minio:
    image: minio/minio:latest
    container_name: eq12_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY:-eq12admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:-eq12secret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "./vol/minio:/data"
      - "../../../../../data:/eq12data:ro" # Access to existing EQ12 data
    networks:
      - eq12-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${EQ12_HOST:-localhost}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=le"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  postgres:
    image: postgres:16-alpine
    container_name: eq12_postgres
    environment:
      POSTGRES_DB: eq12_enterprise
      POSTGRES_USER: eq12user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-eq12pgpass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - "./vol/pg:/var/lib/postgresql/data"
      - "./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql"
    networks:
      - eq12-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eq12user -d eq12_enterprise"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: eq12_redis
    ports:
      - "6379:6379"
    volumes:
      - "./vol/redis:/data"
    networks:
      - eq12-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: eq12_prometheus
    ports:
      - "9090:9090"
    volumes:
      - "../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./vol/prometheus:/prometheus"
      - "../../../../../logs:/eq12logs:ro" # Access to existing EQ12 logs
    networks:
      - eq12-network
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${EQ12_HOST:-localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=le"

  grafana:
    image: grafana/grafana:latest
    container_name: eq12_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-eq12admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_ALLOW_EMBEDDING: true
    volumes:
      - "../grafana/provisioning:/etc/grafana/provisioning"
      - "../grafana/dashboards:/var/lib/grafana/dashboards"
      - "./vol/grafana:/var/lib/grafana"
      - "../../../../../dashboard:/eq12dashboard:ro" # Access to existing HMI dashboard
    networks:
      - eq12-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${EQ12_HOST:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"

  loki:
    image: grafana/loki:latest
    container_name: eq12_loki
    ports:
      - "3100:3100"
    volumes:
      - "../loki/loki-config.yml:/etc/loki/local-config.yaml"
      - "./vol/loki:/tmp/loki"
    networks:
      - eq12-network
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml

  # EQ12 Core Services
  eq12-parlay-engine:
    build:
      context: ../../apps/eq12_parlay_engine
      dockerfile: Dockerfile
    container_name: eq12_parlay_engine
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_KEY: ${MINIO_KEY:-eq12admin}
      S3_SECRET: ${MINIO_SECRET:-eq12secret123}
      PG_DSN: postgresql://eq12user:${PG_PASSWORD:-eq12pgpass}@postgres:5432/eq12_enterprise
      REDIS_URL: redis://redis:6379/0
      EQ12_CONFIG_PATH: /eq12configs/eq12_master_config.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: eq12-parlay-engine
      EQ12_COMPONENT_COUNT: "312"
    volumes:
      - "../../../../../scripts:/eq12scripts:ro" # Access to all 312 EQ12 components
      - "../../../../../configs:/eq12configs:ro" # Access to generated configurations
      - "../../../../../logs:/eq12logs:rw" # Write access to logs
    networks:
      - eq12-network
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.parlay.rule=Host(`${EQ12_HOST:-localhost}`) && PathPrefix(`/api/parlay`)"
      - "traefik.http.routers.parlay.entrypoints=websecure"
      - "traefik.http.routers.parlay.tls.certresolver=le"
      - "traefik.http.middlewares.parlay-strip.stripprefix.prefixes=/api/parlay"
      - "traefik.http.routers.parlay.middlewares=parlay-strip"

  eq12-model-server:
    build:
      context: ../../apps/eq12_model_server
      dockerfile: Dockerfile
    container_name: eq12_model_server
    environment:
      USE_CORAL: ${USE_CORAL:-false}
      EQ12_CONFIG_PATH: /eq12configs/eq12_master_config.json
      REDIS_URL: redis://redis:6379/1
      OTEL_SERVICE_NAME: eq12-model-server
    volumes:
      - "../../../../../scripts:/eq12scripts:ro" # Access to 52 AI models
      - "../../../../../configs:/eq12configs:ro"
      - "../../../../../data:/eq12data:ro" # Access to model data
    networks:
      - eq12-network
    restart: unless-stopped
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.models.rule=Host(`${EQ12_HOST:-localhost}`) && PathPrefix(`/api/models`)"
      - "traefik.http.routers.models.entrypoints=websecure"
      - "traefik.http.routers.models.tls.certresolver=le"
      - "traefik.http.middlewares.models-strip.stripprefix.prefixes=/api/models"
      - "traefik.http.routers.models.middlewares=models-strip"

  # EQ12 Configuration Sync Service
  eq12-config-sync:
    image: python:3.12-slim
    container_name: eq12_config_sync
    working_dir: /app
    command: >
      python -c "
      import time, json, os, logging;
      logging.basicConfig(level=logging.INFO);
      logger = logging.getLogger('eq12-config-sync');
      logger.info('EQ12 Config Sync Service Started');
      while True:
        try:
          if os.path.exists('/eq12configs/eq12_master_config.json'):
            with open('/eq12configs/eq12_master_config.json', 'r') as f:
              config = json.load(f);
            component_count = len(config.get('components', []));
            logger.info(f'Monitoring {component_count} EQ12 components - System healthy');
          else:
            logger.warning('EQ12 master config not found');
          time.sleep(60);
        except Exception as e:
          logger.error(f'Config sync error: {e}');
          time.sleep(30);
      "
    volumes:
      - "../../../../../configs:/eq12configs:ro"
      - "../../../../../scripts:/eq12scripts:ro"
      - "../../../../../logs:/eq12logs:rw"
    networks:
      - eq12-network
    restart: unless-stopped
    environment:
      EQ12_COMPONENTS_COUNT: "312"
      PYTHONUNBUFFERED: "1"

  # EQ12 System Bridge (Integration with C# Control Interface)
  eq12-system-bridge:
    image: alpine:latest
    container_name: eq12_system_bridge
    command: >
      sh -c "
      echo 'EQ12 System Bridge Started';
      echo 'Monitoring integration with C# EQ12SystemManager.exe';
      echo 'Control Interface Path: C:/EQ12/EQ12SystemManager/bin/Release/net8.0-windows/EQ12SystemManager.exe';
      echo 'Configuration Path: C:/EQ12/configs/eq12_master_config.json';
      echo 'Component Count: 312 (111 betting engines, 52 AI models, 61 automation scripts)';
      while true; do
        echo \"[$(date)] EQ12 System Bridge: Docker services integrated with native Windows control interface\";
        sleep 300;
      done
      "
    volumes:
      - "../../../../../EQ12SystemManager:/control:ro"
      - "../../../../../configs:/eq12configs:ro"
      - "../../../../../logs:/eq12logs:rw"
    networks:
      - eq12-network
    restart: unless-stopped
    environment:
      EQ12_WORKSPACE: "C:\\EQ12"
      CONTROL_INTERFACE_PATH: "C:\\EQ12\\EQ12SystemManager\\bin\\Release\\net8.0-windows\\EQ12SystemManager.exe"
      HMI_DASHBOARD_PATH: "C:\\EQ12\\dashboard\\eq12_live_hmi.html"

  # OpenTelemetry Collector (Optional)
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: eq12_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - "../otel/otel-collector-config.yml:/etc/otel-collector-config.yml"
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - eq12-network
    restart: unless-stopped
    depends_on:
      - prometheus

# Networks
networks:
  eq12-network:
    driver: bridge
    name: eq12-enterprise

# Volumes
volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

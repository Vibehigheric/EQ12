version: "3.8"

services:
  # EQ12 License Server
  eq12-license-server:
    build:
      context: .
      dockerfile: Dockerfile.license
    container_name: eq12-license-server
    environment:
      - DATABASE_URL=postgresql://eq12:${POSTGRES_PASSWORD}@postgres:5432/eq12_license
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - EQ12_API_KEY=${EQ12_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - eq12-network

  # EQ12 GitHub App
  eq12-github-app:
    build:
      context: ./apps/eq12-github-app
      dockerfile: Dockerfile
    container_name: eq12-github-app
    environment:
      - APP_ID=${GITHUB_APP_ID}
      - PRIVATE_KEY_PATH=/app/private-key.pem
      - WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - EQ12_LICENSE=http://eq12-license-server:8000
      - EQ12_API_KEY=${EQ12_API_KEY}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - eq12-license-server
    volumes:
      - ./apps/eq12-github-app/private-key.pem:/app/private-key.pem:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - eq12-network

  # EQ12 PR Reviewer
  eq12-pr-reviewer:
    build:
      context: ./apps/eq12-pr-reviewer
      dockerfile: Dockerfile
    container_name: eq12-pr-reviewer
    environment:
      - APP_ID=${GITHUB_APP_ID_PR}
      - PRIVATE_KEY_PATH=/app/private-key.pem
      - WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET_PR}
      - EQ12_API_KEY=${EQ12_API_KEY}
      - EQ12_LICENSE=http://eq12-license-server:8000
      - NODE_ENV=production
    ports:
      - "3001:3000"
    depends_on:
      - eq12-license-server
    volumes:
      - ./apps/eq12-pr-reviewer/private-key.pem:/app/private-key.pem:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - eq12-network

  # EQ12 Dashboard
  eq12-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: eq12-dashboard
    environment:
      - REACT_APP_API_URL=http://eq12-license-server:8000
      - REACT_APP_EQ12_API=${EQ12_API_KEY}
    ports:
      - "80:80"
    depends_on:
      - eq12-license-server
    restart: unless-stopped
    networks:
      - eq12-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eq12-postgres
    environment:
      - POSTGRES_DB=eq12_license
      - POSTGRES_USER=eq12
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - eq12-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: eq12-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - eq12-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: eq12-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - eq12-dashboard
      - eq12-license-server
      - eq12-github-app
    restart: unless-stopped
    networks:
      - eq12-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: eq12-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - eq12-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: eq12-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - eq12-network

  # Log Aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: eq12-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - eq12-network

  # Log Collection - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: eq12-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/eq12
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - eq12-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  eq12-network:
    driver: bridge

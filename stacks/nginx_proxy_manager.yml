version: '3.8'

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy-net
    deploy:
      placement:
        constraints:
          - node.role == manager

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  proxy-net:
    external: true
